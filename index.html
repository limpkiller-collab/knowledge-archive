<!DOCTYPE html>
<html lang="ko" id="htmlRoot" class="theme-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지식 Archive</title>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="지식 Archive">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* ============================
       DESIGN TOKENS — Editorial
       ============================ */
    :root {
      --bg: #ffffff; --surface: #f4f4f4;
      --text: #111111; --text-sec: #555555;
      --rule: #111111; --border: #dddddd;
      --accent: #b3261e;
    }
    html.theme-dark {
      --bg: #111111; --surface: #1d1d1d;
      --text: #f5f5f5; --text-sec: #b8b8b8;
      --rule: #f5f5f5; --border: #3a3a3a;
      --accent: #ff8a80;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.6; -webkit-font-smoothing: antialiased;
      letter-spacing: -0.02em; min-height: 100vh;
    }
    button { font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; }
    a { color: var(--text); }

    /* ===== SIDEBAR ===== */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 250px; padding: 32px 22px 24px;
      border-right: 1px solid var(--rule); overflow-y: auto; display: flex; flex-direction: column;
    }
    .brand {
      font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: -0.05em;
      padding-bottom: 18px; border-bottom: 4px solid var(--rule);
    }
    .nav-label { font-size: 11px; font-weight: 900; letter-spacing: 0.08em; color: var(--text-sec); padding: 20px 0 6px; }
    .nav-item {
      display: flex; align-items: center; width: 100%; min-height: 44px; padding: 0;
      background: none; border: 0; border-bottom: 1px solid var(--border);
      font-size: 15px; font-weight: 500; text-align: left;
    }
    .nav-item:hover { color: var(--accent); }
    .nav-item.active { font-weight: 900; color: var(--accent); }
    .nav-count { margin-left: auto; font-size: 13px; color: var(--text-sec); }
    .nav-item.active .nav-count { color: var(--accent); }
    .sidebar-foot { margin-top: auto; padding-top: 24px; display: flex; flex-direction: column; gap: 12px; }
    .read-progress { font-size: 12px; color: var(--text-sec); }
    .progress-track { height: 3px; background: var(--border); margin-top: 6px; }
    .progress-fill { height: 100%; background: var(--rule); width: 0; }
    .tool-row { display: flex; gap: 8px; }
    .tool-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 44px; padding: 0 12px; background: none; border: 1px solid var(--rule); font-size: 13px; font-weight: 700;
    }
    .tool-btn:hover { background: var(--rule); color: var(--bg); }

    /* ===== MAIN ===== */
    .main { margin-left: 250px; padding: 28px 40px 64px; }
    .inner { max-width: 1040px; display: flex; flex-direction: column; gap: 28px; }
    .masthead {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
      border-bottom: 1px solid var(--rule); padding-bottom: 12px; font-size: 13px; color: var(--text-sec);
    }
    .search {
      margin-left: auto; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--rule); height: 44px; color: var(--text);
    }
    .search input {
      width: 220px; max-width: 60vw; border: 0; background: transparent; outline: none;
      font: inherit; font-size: 14px; color: var(--text);
    }
    .search input::placeholder { color: var(--text-sec); }

    .lead-row { display: flex; flex-wrap: wrap; gap: 40px; }
    .lead { flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px; text-decoration: none; }
    .kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--accent); }
    .lead-title { font-size: 42px; font-weight: 900; line-height: 1.2; letter-spacing: -0.04em; }
    .lead:hover .lead-title { color: var(--accent); }
    .lead-summary { font-size: 17px; line-height: 1.75; color: var(--text-sec); max-width: 600px; }
    .lead-more {
      font-size: 14px; font-weight: 700; min-height: 44px; display: inline-flex; align-items: center;
      border-top: 1px solid var(--rule); border-bottom: 1px solid var(--border);
    }
    .recent { flex: 1 1 300px; min-width: 0; }
    .recent h2 { font-size: 14px; font-weight: 900; padding-bottom: 10px; border-bottom: 2px solid var(--rule); }
    .recent-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); text-decoration: none; }
    .recent-item:hover .recent-title { color: var(--accent); }
    .recent-no { font-size: 22px; font-weight: 900; color: var(--text-sec); line-height: 1.2; width: 30px; flex: none; }
    .recent-title { font-size: 15px; font-weight: 700; line-height: 1.45; display: block; margin-top: 4px; }
    .item-meta { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--text-sec); }

    /* ===== LIST HEAD & FILTERS ===== */
    .section-head {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px;
      border-top: 4px solid var(--rule); padding-top: 10px;
    }
    .section-head h2 { font-size: 14px; font-weight: 900; }
    .active-filters { font-size: 13px; color: var(--accent); font-weight: 700; }
    .head-tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
    .text-tab {
      min-height: 44px; background: none; border: 0; border-bottom: 2px solid transparent;
      font-size: 13px; color: var(--text-sec);
    }
    .text-tab.active { font-weight: 900; color: var(--text); border-bottom-color: var(--rule); }
    .view-toggle { display: flex; border: 1px solid var(--rule); }
    .view-toggle button { min-height: 44px; padding: 0 16px; border: 0; background: var(--bg); font-size: 13px; font-weight: 500; }
    .view-toggle button[aria-pressed="true"] { background: var(--rule); color: var(--bg); font-weight: 900; }

    .filters { display: flex; flex-direction: column; }
    .filters details { border-bottom: 1px solid var(--border); }
    .filters summary { min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 14px; max-height: 190px; overflow-y: auto; }
    .chip { min-height: 32px; padding: 0 10px; background: none; border: 1px solid var(--border); font-size: 12px; color: var(--text-sec); }
    .chip:hover { border-color: var(--rule); color: var(--text); }
    .chip.active { background: var(--rule); border-color: var(--rule); color: var(--bg); font-weight: 700; }
    .series-banner {
      display: none; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--rule);
    }
    .series-banner-name { font-size: 17px; font-weight: 900; }
    .series-banner-desc { font-size: 13px; color: var(--text-sec); }
    .series-banner button { margin-left: auto; flex: none; }

    /* ===== CARDS ===== */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0 32px; }
    .ka-card { display: flex; flex-direction: column; border-bottom: 1px solid var(--border); padding: 18px 0 6px; min-width: 0; }
    .card-link { display: flex; flex-direction: column; gap: 8px; text-decoration: none; }
    .card-title { font-size: 19px; font-weight: 900; line-height: 1.4; letter-spacing: -0.03em; }
    .card-link:hover .card-title { color: var(--accent); }
    .ka-card.is-read .card-title { color: var(--text-sec); font-weight: 700; }
    .card-summary {
      font-size: 13px; line-height: 1.6; color: var(--text-sec);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; min-height: 44px; }
    .card-tags { font-size: 12px; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .series-link { background: none; border: 0; font-size: 12px; font-weight: 700; text-decoration: underline; min-height: 44px; white-space: nowrap; }
    .read-btn {
      margin-left: auto; flex: none; min-height: 32px; padding: 0 10px; background: none;
      border: 1px solid var(--border); font-size: 12px; color: var(--text-sec);
    }
    .read-btn:hover { border-color: var(--rule); color: var(--text); }
    .del-btn { flex: none; min-height: 32px; padding: 0 10px; background: none; border: 1px solid var(--border); font-size: 12px; color: var(--text-sec); }
    .del-btn:hover { border-color: var(--accent); color: var(--accent); }
    .del-btn + .read-btn { margin-left: 0; }
    .card-foot .del-btn { margin-left: auto; }
    .ka-card.is-read .read-btn { background: var(--rule); border-color: var(--rule); color: var(--bg); font-weight: 700; }

    /* 타일: 카드 뷰와 그리드 뷰가 같은 모양(세로 3:4)을 쓴다 */
    .card-cover {
      display: none; position: relative; flex-direction: column; aspect-ratio: 3 / 4; overflow: hidden;
      color: #ffffff; background: var(--surface); container-type: inline-size;
    }
    .card-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover-label { position: relative; font-size: max(9px, 5.5cqw); font-weight: 700; letter-spacing: 0.06em; padding: 7cqw 7cqw 0; }
    .cover-word { position: relative; font-size: 21cqw; font-weight: 900; line-height: 1.05; letter-spacing: -0.05em; padding: 3cqw 7cqw 0; overflow-wrap: anywhere; }
    .cover-word.is-long { font-size: 15cqw; }
    .cover-video {
      position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 5px;
      background: #ffffff; display: flex; align-items: center; justify-content: center;
    }
    .cover-title {
      display: none; position: relative; margin-top: auto; background: #111111; color: #ffffff;
      font-size: 12px; font-weight: 700; line-height: 1.35; padding: 6px 8px 0; border-bottom: 6px solid #111111;
      max-height: calc(2.7em + 12px); -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .card-grid.view-card { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 32px 24px; }
    .card-grid.view-card .ka-card { padding: 0 0 6px; border-bottom-color: var(--rule); }
    .card-grid.view-card .card-cover { display: flex; margin-bottom: 4px; }

    .card-grid.view-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 2px; }
    .card-grid.view-grid .ka-card { padding: 0; border: 0; }
    .card-grid.view-grid .card-link { gap: 0; }
    .card-grid.view-grid .card-cover { display: flex; }
    .card-grid.view-grid .cover-title { display: -webkit-box; }
    .card-grid.view-grid .item-meta, .card-grid.view-grid .card-title,
    .card-grid.view-grid .card-summary, .card-grid.view-grid .card-foot { display: none; }
    .card-grid.view-grid .ka-card.is-read .card-cover { opacity: 0.55; }
    .card-grid.view-grid .card-link:hover .card-cover { outline: 3px solid var(--accent); outline-offset: -3px; }

    .empty-state { display: none; padding: 56px 0; text-align: center; color: var(--text-sec); font-size: 15px; }

    @media (max-width: 760px) {
      .sidebar { position: static; width: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 20px 20px 12px; overflow: visible; }
      .brand { font-size: 22px; padding-bottom: 12px; }
      .brand br { display: none; }
      .nav-label { padding: 12px 0 0; }
      .sidebar-nav { display: flex; gap: 18px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .nav-item { width: auto; flex: none; border-bottom: 0; white-space: nowrap; gap: 6px; }
      .nav-count { margin-left: 0; }
      .sidebar-foot { flex-direction: row; align-items: center; justify-content: space-between; padding-top: 8px; }
      .read-progress { flex: 1; }
      .main { margin-left: 0; padding: 20px 20px 48px; }
      .lead-title { font-size: 30px; }
      .lead-row { gap: 28px; }
      .search { margin-left: 0; width: 100%; }
      .search input { width: 100%; max-width: none; }
      .head-tools { margin-left: 0; width: 100%; justify-content: space-between; }
      .card-grid.view-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0 -20px; }
      .card-grid.view-card { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px; }
      .cover-title { font-size: 11px; }
      .card-grid.view-card .card-title { font-size: 15px; }
      .view-toggle button { padding: 0 12px; }
    }

    /* ============================
       SWIPE OVERLAY (unchanged)
       ============================ */
    .swipe-overlay {
      display: none; position: fixed; inset: 0; z-index: 10000;
      background: rgba(0,0,0,0.96); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      flex-direction: column; align-items: center; justify-content: center;
      padding: 56px 12px 16px;
    }
    .swipe-overlay.active { display: flex; }
    .swipe-top-bar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
    }
    .swipe-counter { font-size: 13px; color: rgba(255,255,255,0.45); font-weight: 600; }
    .swipe-close {
      width: 36px; height: 36px; border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.7); cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center; transition: background 0.15s;
    }
    .swipe-close:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .swipe-stage { width: min(860px, 96vw); flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 0; }
    .swipe-card-wrap {
      flex: 1; width: 100%; min-height: 0;
      position: relative; border-radius: 16px; overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
      transition: transform 0.28s cubic-bezier(0.4,0,0.2,1), opacity 0.28s;
      will-change: transform, opacity;
    }
    .swipe-frame { width: 100%; height: 100%; border: none; display: block; background: #0a0a0a; }
    .swipe-drag-overlay {
      position: absolute; inset: 0; z-index: 10;
      cursor: grab; touch-action: none; user-select: none;
    }
    .swipe-drag-overlay.is-dragging { cursor: grabbing; }
    .swipe-drag-overlay.pass-through { pointer-events: none; }
    .swipe-loading {
      position: absolute; inset: 0; z-index: 5;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0a; gap: 10px; color: rgba(255,255,255,0.35); font-size: 14px; transition: opacity 0.2s;
    }
    @keyframes swipeSpin { to { transform: rotate(360deg); } }
    .swipe-spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.1); border-top-color: rgba(255,255,255,0.55);
      animation: swipeSpin 0.75s linear infinite;
    }
    .swipe-nav { display: flex; align-items: center; gap: 16px; margin-top: 14px; flex-shrink: 0; }
    .swipe-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.7); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.15s;
    }
    .swipe-btn:hover { background: rgba(255,255,255,0.14); color: #fff; transform: scale(1.06); }
    .swipe-btn:disabled { opacity: 0.25; cursor: default; transform: none !important; }
    .swipe-dots { display: flex; gap: 6px; align-items: center; }
    .swipe-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: all 0.2s; }
    .swipe-dot.active { width: 20px; border-radius: 3px; background: rgba(255,255,255,0.7); }
    .swipe-hint { font-size: 11px; color: rgba(255,255,255,0.22); margin-top: 10px; text-align: center; flex-shrink: 0; }
    .swipe-read-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.6); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;
    }
    .swipe-read-btn:hover { background: rgba(255,255,255,0.14); color: #fff; transform: scale(1.06); }
    .swipe-read-btn.is-read {
      background: #10b981; border-color: #10b981; color: #fff;
      box-shadow: 0 0 16px rgba(16,185,129,0.4);
    }
    .swipe-read-btn.is-read:hover { background: #059669; border-color: #059669; }

  </style>
</head>
<body>
  <a href="#main" class="sr-only">본문으로 건너뛰기</a>

  <nav class="sidebar" aria-label="카테고리 메뉴">
    <div class="brand">지식 <br>Archive</div>
    <div class="nav-label">카테고리</div>
    <div class="sidebar-nav" id="catNav"></div>
    <div class="nav-label">형식</div>
    <div class="sidebar-nav" id="typeNav"></div>
    <div class="sidebar-foot">
      <div class="read-progress">
        읽음 <strong id="readCount">0</strong> / <span id="totalCount">0</span>
        <div class="progress-track"><div class="progress-fill" id="readProgress"></div></div>
      </div>
      <div class="tool-row">
        <button type="button" class="tool-btn" onclick="cycleTheme()" id="themeBtn" aria-label="테마 전환">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          <span id="themeLabel">다크</span>
        </button>
        <button type="button" class="tool-btn" onclick="openSwipeView()" aria-label="랜덤 보기">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg>
          랜덤
        </button>
      </div>
    </div>
  </nav>

  <main class="main" id="main">
    <div class="inner">
      <header class="masthead">
        <span>하나의 지식, 하나의 페이지 · 직접 정리한 카드와 보낸 링크가 한곳에 쌓입니다</span>
        <label class="search">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input type="text" id="searchInput" placeholder="제목·태그·키워드 검색" aria-label="지식 검색">
        </label>
      </header>

      <div class="lead-row" id="leadRow">
        <a class="lead" id="leadCard" href="#"></a>
        <aside class="recent" aria-label="최근 추가">
          <h2>최근 추가</h2>
          <div id="recentList"></div>
        </aside>
      </div>

      <section aria-label="전체 카드" style="display:flex;flex-direction:column;gap:4px;">
        <div class="section-head">
          <h2 id="listTitle">전체 카드</h2>
          <span class="item-meta" id="resultsCount">0장</span>
          <span class="active-filters" id="activeFilters"></span>
          <div class="head-tools">
            <div role="group" aria-label="읽음 필터" style="display:flex;gap:16px;">
              <button type="button" class="text-tab active" id="readTab-all" onclick="filterRead('all')">전체</button>
              <button type="button" class="text-tab" id="readTab-unread" onclick="filterRead('unread')">미읽음</button>
              <button type="button" class="text-tab" id="readTab-read" onclick="filterRead('read')">읽음</button>
            </div>
            <div class="view-toggle" role="group" aria-label="보기 방식">
              <button type="button" id="viewBtn-list" aria-pressed="true" onclick="setView('list')">리스트</button>
              <button type="button" id="viewBtn-card" aria-pressed="false" onclick="setView('card')">카드</button>
              <button type="button" id="viewBtn-grid" aria-pressed="false" onclick="setView('grid')">그리드</button>
            </div>
          </div>
        </div>

        <div class="filters">
          <details id="tagDetails">
            <summary>태그 <span class="item-meta" id="tagSummary"></span></summary>
            <div class="chip-row" id="tagFilters"></div>
          </details>
          <details id="seriesDetails">
            <summary>시리즈 <span class="item-meta" id="seriesSummary"></span></summary>
            <div class="chip-row" id="seriesFilters"></div>
          </details>
        </div>

        <div class="series-banner" id="seriesBanner">
          <div>
            <div class="series-banner-name" id="seriesBannerName"></div>
            <div class="series-banner-desc" id="seriesBannerDesc"></div>
          </div>

        + '<span class="lead-more">카드 열기</span>';
      byId('recentList').innerHTML = ALL_CARDS.slice(1, 6).map(function (k, i) {
        return '<a class="recent-item" href="' + k.file + '"><span class="recent-no">' + (i + 1) + '</span>'
          + '<span><span class="item-meta">' + metaLine(k) + '</span>'
          + '<span class="recent-title">' + k.title + '</span></span></a>';
      }).join('');
    }
    function renderStats() {
      var total = ALL_CARDS.length;
      var read = ALL_CARDS.filter(function (k) { return !!readStatus[k.id]; }).length;
      byId('readCount').textContent = read;
      byId('totalCount').textContent = total;
      byId('readProgress').style.width = (total ? Math.round(read / total * 100) : 0) + '%';
      renderLead();
    }

    // ============ CARDS ============
    var VIDEO_BADGE = '<span class="cover-video" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z" fill="#111111"></path></svg></span>';
    var MULTI_BADGE = '<span class="cover-video cover-multi" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#111111" stroke-width="1.4"><rect x="1" y="3.5" width="7.5" height="7.5" rx="1"></rect><path d="M3.5 1h6.5a1 1 0 0 1 1 1v6.5"></path></svg></span>';
    var ADDED_IMAGES = {};  // card-images.json: 카드에 직접 추가한 이미지
    // 카드마다 넘겨 볼 이미지 수를 세고, 커버가 없는 카드는 첫 이미지를 썸네일로 쓴다.
    function applyGalleries(cards) {
      cards.forEach(function (k) {
        var g = ArchiveCore.galleryFor(k, ADDED_IMAGES[ArchiveCore.cardKey(k)]);
        k.imageCount = g.length;
        if (!k.cover && g.length) k.cover = g[0].path;
      });
      return cards;
    }
    function coverHtml(k) {
      var cv = ArchiveCore.coverFor(k, CATEGORIES);
      var isVideo = k.sourceType === 'instagram_reel' || k.sourceType === 'youtube';
      var tail = (isVideo ? VIDEO_BADGE : (k.imageCount > 1 ? MULTI_BADGE : '')) + '<span class="cover-title">' + k.title + '</span></span>';
      if (cv.kind === 'image') {
        return '<span class="card-cover is-image"><img src="' + attr(cv.src) + '" alt="" loading="lazy">' + tail;
      }
      return '<span class="card-cover" style="background:' + cv.color + '">'
        + '<span class="cover-label" aria-hidden="true">' + k.category + '</span>'
        + '<span class="cover-word' + (cv.word.length > 4 ? ' is-long' : '') + '" aria-hidden="true">' + cv.word + '</span>' + tail;
    }
    function renderCards() {
      var filtered = filterCards();
      var grid = byId('cardGrid');
      var f = currentFilter();
      var narrowed = f.category !== 'all' || f.type !== 'all' || f.tag !== 'all' || f.series !== 'all' || !!f.query;

      grid.innerHTML = filtered.map(function (k) {
        var isRead = !!readStatus[k.id];
        var tags = (k.tags || []).slice(0, 3).map(function (t) { return '#' + t; }).join(' ');
        var series = k.series
          ? '<button type="button" class="series-link" onclick="filterSeries(\'' + attr(jsStr(k.series)) + '\')">' + k.series + '</button>'
          : '<span class="card-tags">' + tags + '</span>';
        return '<article class="ka-card' + (isRead ? ' is-read' : '') + '" role="listitem">'
          + '<a class="card-link" href="' + k.file + '">' + coverHtml(k)
          + '<span class="item-meta">' + metaLine(k) + '</span>'
          + '<span class="card-title">' + k.title + '</span>'
          + '<span class="card-summary">' + k.summary + '</span></a>'
          + '<div class="card-foot">' + series
          + (k.sourceType !== 'manual'
            ? '<button type="button" class="del-btn" onclick="deleteCard(\'' + attr(jsStr(k.id)) + '\')">삭제</button>' : '')
          + '<button type="button" class="read-btn" onclick="toggleRead(\'' + attr(jsStr(k.id)) + '\')" aria-pressed="' + isRead + '">'
          + (isRead ? '읽음 ✓' : '읽음 표시') + '</button></div></article>';
      }).join('');

      ['list', 'card', 'grid'].forEach(function (v) {
        grid.classList.toggle('view-' + v, activeView === v);
        byId('viewBtn-' + v).setAttribute('aria-pressed', String(activeView === v));
      });
      byId('emptyState').style.display = filtered.length ? 'none' : 'block';
      byId('leadRow').style.display = narrowed ? 'none' : '';
      byId('listTitle').textContent = activeCategory === 'all' ? '전체 카드' : activeCategory;
      byId('resultsCount').textContent = filtered.length + '장';

      var desc = [];
      if (activeType !== 'all') desc.push(ArchiveCore.typeLabel(activeType));
      if (activeSeries !== 'all') desc.push(activeSeries);
      if (activeTag !== 'all') desc.push('#' + activeTag);
      if (searchQuery) desc.push('"' + searchQuery + '"');
      byId('activeFilters').textContent = desc.join(' · ');
    }

    // ============ DELETE (자동 스크랩 카드만) ============
    var DISPATCH_URL = 'https://api.github.com/repos/limpkiller-collab/knowledge-archive/dispatches';
    function hiddenIds() {
      try { return JSON.parse(localStorage.getItem('ka-deleted') || '[]'); } catch (e) { return []; }
    }
    function setHiddenIds(ids) {
      try { localStorage.setItem('ka-deleted', JSON.stringify(ids)); } catch (e) {}
    }
    function visibleScraps(scraps) {
      var list = Array.isArray(scraps) ? scraps : [];
      var present = {};
      list.forEach(function (k) { present[k.id] = true; });
      // 삭제 요청 후 사이트가 갱신될 때까지는 숨겨 두고, 실제로 사라진 뒤에는 목록에서 뺀다.
      var hidden = hiddenIds().filter(function (id) { return present[id]; });
      setHiddenIds(hidden);
      return list.filter(function (k) { return hidden.indexOf(k.id) === -1; });
    }
    function deleteToken(forceAsk) {
      var token = null;
      try { token = localStorage.getItem('ka-gh-token'); } catch (e) {}
      if (token && !forceAsk) return token;
      token = window.prompt('삭제하려면 GitHub 토큰이 필요합니다.\n단축어에 넣은 것과 같은 토큰을 붙여넣으세요. 이 기기의 브라우저에만 저장됩니다.');
      token = token ? token.trim() : '';
      if (!token) return null;
      try { localStorage.setItem('ka-gh-token', token); } catch (e) {}
      return token;
    }
    function deleteCard(id) {
      var card = ALL_CARDS.filter(function (k) { return k.id === id; })[0];
      if (!card || card.sourceType === 'manual') return;
      if (!window.confirm('이 카드를 삭제할까요?\n\n' + card.title.replace(/&[a-z#0-9]+;/gi, ' ') + '\n\n사이트와 노션에서 함께 지워집니다.')) return;
      var token = deleteToken(false);
      if (!token) return;
      fetch(DISPATCH_URL, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' },
        body: JSON.stringify({ event_type: 'scrap-delete', client_payload: { id: id } })
      }).then(function (r) {
        if (r.status === 204) {
          setHiddenIds(hiddenIds().concat([id]));
          ALL_CARDS = ALL_CARDS.filter(function (k) { return k.id !== id; });
          renderAll();
          return;
        }
        if (r.status === 401 || r.status === 403 || r.status === 404) {
          try { localStorage.removeItem('ka-gh-token'); } catch (e) {}
          window.alert('토큰이 맞지 않아 삭제하지 못했습니다. 다시 시도하면 토큰을 새로 묻습니다.');
          return;
        }
        window.alert('삭제 요청에 실패했습니다 (오류 ' + r.status + ').');
      }).catch(function () {
        window.alert('삭제 요청을 보내지 못했습니다. 연결을 확인해 주세요.');
      });
    }

    // ============ SEARCH ============
    var searchTimer;
    byId('searchInput').addEventListener('input', function (e) {
      clearTimeout(searchTimer);
      var val = e.target.value;
      searchTimer = setTimeout(function () { searchQuery = val.trim(); renderCards(); }, 200);
    });

    // ============ THEME ============
    var currentTheme = 'light';
    function applyTheme(t) {
      currentTheme = t;
      byId('htmlRoot').className = 'theme-' + t;
      byId('themeLabel').textContent = t === 'dark' ? '라이트' : '다크';
      try { localStorage.setItem('viz-theme', t); } catch (e) {}
    }
    function cycleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }
    var savedTheme = null;
    try { savedTheme = localStorage.getItem('viz-theme'); } catch (e) {}
    applyTheme(savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : 'light');

    // ============ SWIPE VIEW ============
    var swipeCards = [], swipeIndex = 0, swipeAnimating = false;

    function openSwipeView() {
      var filtered = filterCards();
      if (filtered.length === 0) return;
      swipeCards = filtered.slice().sort(function() { return Math.random() - 0.5; });
      swipeIndex = 0;
      document.getElementById('swipeOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
      renderSwipeDots(); loadSwipeFrame(null); initSwipeDrag();
    }
    function closeSwipeView() {
      document.getElementById('swipeFrame').src = '';
      document.getElementById('swipeOverlay').classList.remove('active');
      document.body.style.overflow = '';
    }
    function loadSwipeFrame(enterDir) {
      var k     = swipeCards[swipeIndex];
      var wrap  = document.getElementById('swipeCardWrap');
      var frame = document.getElementById('swipeFrame');
      var loader = document.getElementById('swipeLoading');
      loader.style.display = 'flex'; frame.style.opacity = '0';
      if (enterDir) {
        wrap.style.transition = 'none';
        wrap.style.transform  = enterDir === 'next' ? 'translateX(80%) rotate(5deg)' : 'translateX(-80%) rotate(-5deg)';
        wrap.style.opacity    = '0';
        void wrap.offsetWidth;
        wrap.style.transition = ''; wrap.style.transform = ''; wrap.style.opacity = '1';
      }
      frame.onload = function() {
        loader.style.display = 'none'; frame.style.opacity = '1';
        try {
          var iDoc = frame.contentDocument || frame.contentWindow.document;
          iDoc.documentElement.className = 'theme-' + currentTheme;
        } catch(e) {}
      };
      frame.src = k.file;
      document.getElementById('swipeCounter').textContent = (swipeIndex + 1) + ' / ' + swipeCards.length;
      document.getElementById('swipePrevBtn').disabled = swipeIndex === 0;
      document.getElementById('swipeNextBtn').disabled = swipeIndex === swipeCards.length - 1;
      updateSwipeDots(); updateSwipeReadBtn();
    }
    function renderSwipeDots() {
      var dots = document.getElementById('swipeDots');
      var max  = Math.min(swipeCards.length, 9);
      var html = '';
      for (var i = 0; i < max; i++) html += '<div class="swipe-dot' + (i === 0 ? ' active' : '') + '" id="dot-' + i + '"></div>';
      if (swipeCards.length > 9) html += '<div class="swipe-dot" style="opacity:0.35;width:4px">…</div>';
      dots.innerHTML = html;
    }
    function updateSwipeDots() {
      var max = Math.min(swipeCards.length, 9);
      for (var i = 0; i < max; i++) {
        var d = document.getElementById('dot-' + i);
        if (d) d.className = 'swipe-dot' + (i === swipeIndex ? ' active' : '');
      }
    }
    function swipeNext() {
      if (swipeAnimating || swipeIndex >= swipeCards.length - 1) return;
      swipeAnimating = true;
      var wrap = document.getElementById('swipeCardWrap');
      wrap.style.transform = 'translateX(-105%) rotate(-7deg)'; wrap.style.opacity = '0';
      setTimeout(function() { swipeIndex++; loadSwipeFrame('next'); swipeAnimating = false; }, 240);
    }
    function swipePrev() {
      if (swipeAnimating || swipeIndex <= 0) return;
      swipeAnimating = true;
      var wrap = document.getElementById('swipeCardWrap');
      wrap.style.transform = 'translateX(105%) rotate(7deg)'; wrap.style.opacity = '0';
      setTimeout(function() { swipeIndex--; loadSwipeFrame('prev'); swipeAnimating = false; }, 240);
    }

    var swipeDragInited = false;
    function initSwipeDrag() {
      if (swipeDragInited) return;
      swipeDragInited = true;
      var overlay = document.getElementById('swipeDragOverlay');
      var wrap    = document.getElementById('swipeCardWrap');
      var startX = 0, startY = 0, prevY = 0, dragDeltaX = 0;
      var dragging = false, dirLocked = null;
      var LOCK_THRESHOLD = 8, SWIPE_THRESHOLD = 65, TAP_LIMIT = 10;
      function getFrame() { return document.getElementById('swipeFrame'); }
      function onStart(x, y) {
        startX = x; startY = y; prevY = y; dragging = true; dragDeltaX = 0; dirLocked = null;
        overlay.classList.add('is-dragging'); wrap.style.transition = 'none';
      }
      function onMove(x, y) {
        if (!dragging) return;
        var dy = y - prevY; prevY = y; dragDeltaX = x - startX;
        if (!dirLocked) {
          var tdx = Math.abs(dragDeltaX), tdy = Math.abs(y - startY);
          if (tdx > LOCK_THRESHOLD || tdy > LOCK_THRESHOLD) {
            dirLocked = tdx >= tdy ? 'h' : 'v';
            /* 수직 방향 확정 시 overlay pointer-events 해제 → iframe 네이티브 스크롤 위임 */
            if (dirLocked === 'v') overlay.style.pointerEvents = 'none';
          }
        }
        if (dirLocked === 'h') {
          var rot = dragDeltaX * 0.022;
          wrap.style.transform = 'translateX(' + (dragDeltaX * 0.55) + 'px) rotate(' + rot + 'deg)';
        }
        if (dirLocked === 'v') {
          try { var fr = getFrame(); if (fr && fr.contentWindow) fr.contentWindow.scrollBy(0, -dy); } catch(e) {}
        }
      }
      function onEnd() {
        if (!dragging) return;
        dragging = false; overlay.classList.remove('is-dragging'); wrap.style.transition = '';
        overlay.style.pointerEvents = ''; /* pointer-events 복원 */
        var locked = dirLocked, delta = dragDeltaX; dirLocked = null;
        if (locked === 'h') {
          wrap.style.transform = '';
          if (Math.abs(delta) < TAP_LIMIT) {
            overlay.classList.add('pass-through');
            setTimeout(function() { overlay.classList.remove('pass-through'); }, 700);
          } else if (delta < -SWIPE_THRESHOLD) { swipeNext(); }
          else if (delta > SWIPE_THRESHOLD) { swipePrev(); }
        } else if (!locked) {
          wrap.style.transform = '';
          overlay.classList.add('pass-through');
          setTimeout(function() { overlay.classList.remove('pass-through'); }, 700);
        }
      }
      overlay.addEventListener('touchstart', function(e) { onStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
      overlay.addEventListener('touchmove', function(e) {
        if (!dragging) return;
        if (dirLocked === 'h') e.preventDefault();
        onMove(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });
      overlay.addEventListener('touchend', onEnd);
      /* pointer-events:none(수직 스크롤) 상태에서 touchend가 overlay를 통과할 경우를 대비해 document에도 등록 */
      document.addEventListener('touchend', onEnd, { passive: true });
      overlay.addEventListener('mousedown', function(e) { onStart(e.clientX, e.clientY); e.preventDefault(); });
      document.addEventListener('mousemove', function(e) { onMove(e.clientX, e.clientY); });
      document.addEventListener('mouseup', onEnd);
    }

    document.addEventListener('keydown', function(e) {
      var ov = document.getElementById('swipeOverlay');
      if (!ov || !ov.classList.contains('active')) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); swipeNext(); }
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); swipePrev(); }
      if (e.key === 'Escape') closeSwipeView();
    });
    document.getElementById('swipeOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeSwipeView();
    });

    // ============ INIT ============
    function renderAll() {
      renderNav(); renderTagFilters(); renderSeriesFilters(); renderStats(); renderCards();
    }
    function loadJson(path, fallback) {
      return fetch(path, { cache: 'no-cache' })
        .then(function (r) { return r.ok ? r.json() : fallback; })
        .catch(function () { return fallback; });
    }
    loadReadStatus();
    renderAll();
    Promise.all([loadJson('categories.json', []), loadJson('scraps.json', []), loadJson('card-images.json', {})]).then(function (res) {
      CATEGORIES = Array.isArray(res[0]) ? res[0] : [];
      ADDED_IMAGES = (res[2] && typeof res[2] === 'object' && !Array.isArray(res[2])) ? res[2] : {};
      ALL_CARDS = applyGalleries(ArchiveCore.mergeCards(KNOWLEDGE_DB, visibleScraps(res[1])));
      renderAll();
    });
  </script>
</body>
</html>
