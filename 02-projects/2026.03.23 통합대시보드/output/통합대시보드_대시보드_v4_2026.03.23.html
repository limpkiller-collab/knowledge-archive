<!DOCTYPE html>
<html lang="ko" data-theme="A">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>★ 통합 자산관리 대시보드</title>
<!-- PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="통합대시보드">
<meta name="theme-color" content="#0c0c14" id="meta-theme-color">
<style>
/* ════════════════════════════════════════════
   CSS 변수 — 3테마 (A: Midnight Violet, B: Arctic Blue, C: Deep Emerald)
   ════════════════════════════════════════════ */

/* ── A. Midnight Violet (다크 글래스모피즘) ── */
:root,[data-theme="A"]{
  --bg:#0c0c14;--card:#13131f;--border:rgba(99,102,241,.12);
  --accent:#818cf8;--accent-bright:#a78bfa;--accent-gradient:linear-gradient(135deg,#6366f1,#8b5cf6);
  --green:#10b981;--red:#f43f5e;--yellow:#f59e0b;--cyan:#22d3ee;
  --text:#e2e8f0;--muted:#94a3b8;--purple:#a78bfa;
  --sidebar-bg:rgba(15,15,24,.92);--sidebar-border:rgba(99,102,241,.08);
  --sidebar-hover:rgba(99,102,241,.08);
  --sidebar-active-bg:linear-gradient(135deg,rgba(99,102,241,.18),rgba(139,92,246,.12));
  --sidebar-active-text:#a78bfa;
  --card-glass:rgba(255,255,255,.03);--card-border:rgba(255,255,255,.05);
  --topbar-bg:rgba(15,15,24,.85);
  --scrollbar-thumb:rgba(99,102,241,.2);
  --loading-bg:#0c0c14;
  --meta-color:#0c0c14;
  --glow-1:radial-gradient(circle,rgba(99,102,241,.06) 0%,transparent 70%);
  --backdrop-blur:blur(16px);
}

/* ── B. Arctic Blue (클린 라이트 모던) ── */
[data-theme="B"]{
  --bg:#f0f4f8;--card:#ffffff;--border:#e2e8f0;
  --accent:#0284c7;--accent-bright:#0ea5e9;--accent-gradient:linear-gradient(135deg,#0ea5e9,#06b6d4);
  --green:#059669;--red:#dc2626;--yellow:#d97706;--cyan:#0891b2;
  --text:#0f172a;--muted:#64748b;--purple:#7c3aed;
  --sidebar-bg:#ffffff;--sidebar-border:#e2e8f0;
  --sidebar-hover:rgba(14,165,233,.06);
  --sidebar-active-bg:linear-gradient(135deg,#e0f2fe,#f0f9ff);
  --sidebar-active-text:#0284c7;
  --card-glass:#ffffff;--card-border:#e2e8f0;
  --topbar-bg:#ffffff;
  --scrollbar-thumb:#cbd5e1;
  --loading-bg:#f0f4f8;
  --meta-color:#f0f4f8;
  --glow-1:none;
  --backdrop-blur:blur(0px);
}

/* ── C. Deep Emerald (프리미엄 다크 그라디언트) ── */
[data-theme="C"]{
  --bg:#080d12;--card:#0d1419;--border:rgba(16,185,129,.1);
  --accent:#10b981;--accent-bright:#34d399;--accent-gradient:linear-gradient(135deg,#10b981,#059669);
  --green:#34d399;--red:#f43f5e;--yellow:#f59e0b;--cyan:#22d3ee;
  --text:#e2e8f0;--muted:#94a3b8;--purple:#a78bfa;
  --sidebar-bg:linear-gradient(180deg,#0a1218 0%,#081210 100%);--sidebar-border:rgba(16,185,129,.08);
  --sidebar-hover:rgba(16,185,129,.06);
  --sidebar-active-bg:linear-gradient(135deg,rgba(16,185,129,.12),rgba(5,150,105,.08));
  --sidebar-active-text:#34d399;
  --card-glass:rgba(255,255,255,.02);--card-border:rgba(16,185,129,.06);
  --topbar-bg:rgba(10,18,24,.9);
  --scrollbar-thumb:rgba(16,185,129,.2);
  --loading-bg:#080d12;
  --meta-color:#080d12;
  --glow-1:radial-gradient(circle,rgba(16,185,129,.05) 0%,transparent 70%);
  --backdrop-blur:blur(12px);
}

*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  font-family:'Pretendard','Segoe UI',-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow:hidden;
  transition:background .35s ease,color .35s ease;
}
button,input,select,a,label{touch-action:manipulation;}
body{overscroll-behavior-y:contain;}

/* ════════════════════════════════════════════
   레이아웃
   ════════════════════════════════════════════ */
.app{display:flex;height:100vh;width:100vw;overflow:hidden;}

/* ── 사이드바 ── */
.sidebar{
  width:260px;flex-shrink:0;height:100vh;
  background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);
  display:flex;flex-direction:column;
  transition:transform .28s cubic-bezier(.4,0,.2,1),box-shadow .28s,background .35s ease;
  z-index:200;overflow:hidden;
  backdrop-filter:var(--backdrop-blur);-webkit-backdrop-filter:var(--backdrop-blur);
}
.sidebar.collapsed{transform:translateX(-260px);position:absolute;top:0;left:0;}

/* 사이드바 헤더 */
.sb-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 16px 14px;border-bottom:1px solid var(--border);flex-shrink:0;
  transition:border-color .35s ease;
}
.sb-logo{display:flex;align-items:center;gap:10px;}
.sb-logo-icon{font-size:22px;}
.sb-logo-text{font-size:18px;font-weight:800;color:var(--accent-bright);transition:color .35s ease;}
.sb-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;
  padding:4px 8px;border-radius:6px;line-height:1;transition:all .15s;}
.sb-close:hover{background:var(--sidebar-hover);color:var(--text);}

/* 스크롤 영역 */
.sb-scroll{flex:1;overflow-y:auto;padding:12px 8px 24px;}
.sb-scroll::-webkit-scrollbar{width:3px;}
.sb-scroll::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px;}

/* ── 티어별 들여쓰기/폰트 통일 ──
   Tier 1 (그룹 제목): left 12px   — 💰 자산관리, 📈 포트폴리오
   Tier 2 (서브 제목): left 28px   — 📊 대시보드, 🏦 총자산, 📒 가계부 …
   Tier 3 (리프):      left 44px   — 💰 자산관리, 수입/지출관리, 합계, 📊 대시보드 …
   Tier 4 (최하위):    left 58px   — 월간 분석, 연간 분석, 상세 내역
   모든 폰트 크기: 14px 통일
   ───────────────────────────────── */

/* Tier 1 — 그룹 제목 */
.sb-group{margin-bottom:4px;}
.sb-group-title{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;border-radius:9px;
  cursor:pointer;color:var(--text);font-size:14px;font-weight:700;
  transition:all .15s;user-select:none;
}
.sb-group-title:hover{background:var(--sidebar-hover);}
.sb-group-title .sb-arrow{font-size:10px;transition:transform .2s;margin-left:auto;}
.sb-group-title.expanded .sb-arrow{transform:rotate(180deg);}
.sb-group-items{overflow:hidden;max-height:0;transition:max-height .3s ease;}
.sb-group-items.open{max-height:600px;}

/* Tier 2 — 서브 그룹 제목 + 단독 아이템 (총자산, 뉴스 등) */
.sb-sub{margin-bottom:1px;}
.sb-sub-title{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px 9px 28px;border-radius:8px;
  cursor:pointer;color:var(--muted);font-size:14px;font-weight:700;
  transition:all .15s;user-select:none;
  border:none;background:none;width:100%;text-align:left;
}
.sb-sub-title:hover{background:var(--sidebar-hover);color:var(--text);}
.sb-sub-title .sb-icon{font-size:14px;flex-shrink:0;width:20px;text-align:center;}
.sb-sub-title .sb-arrow{font-size:10px;transition:transform .2s;margin-left:auto;}
.sb-sub-title.expanded .sb-arrow{transform:rotate(180deg);}
.sb-sub-items{overflow:hidden;max-height:0;transition:max-height .25s ease;}
.sb-sub-items.open{max-height:400px;}

.sb-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px 9px 28px;border-radius:8px;
  cursor:pointer;color:var(--muted);font-size:14px;font-weight:700;
  transition:all .15s;user-select:none;white-space:nowrap;
  border:none;background:none;width:100%;text-align:left;
}
.sb-item:hover{background:var(--sidebar-hover);color:var(--text);}
.sb-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text);font-weight:700;}
.sb-item .sb-icon{font-size:14px;flex-shrink:0;width:20px;text-align:center;}
.sb-item .sb-label{flex:1;}

/* Tier 3 — 리프 아이템 */
.sb-leaf{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px 8px 44px;border-radius:7px;
  cursor:pointer;color:var(--muted);font-size:14px;font-weight:500;
  transition:all .15s;user-select:none;
  border:none;background:none;width:100%;text-align:left;
}
.sb-leaf:hover{background:var(--sidebar-hover);color:var(--text);}
.sb-leaf.active{color:var(--sidebar-active-text);font-weight:700;}
.sb-leaf-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.5;}
.sb-leaf.active .sb-leaf-dot{opacity:1;}

/* Tier 4 — 최하위 리프 (수입/지출관리 하위) */
.sb-leaf.t4{padding-left:58px;}

/* 사이드바 푸터 */
.sb-footer{padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0;transition:border-color .35s ease;}
.sb-footer-text{font-size:12px;color:var(--muted);text-align:center;}
.sb-footer-ver{font-size:11px;color:var(--muted);text-align:center;margin-top:2px;opacity:.5;}

/* ── 메인 콘텐츠 ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden;}

/* 상단 바 */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;border-bottom:1px solid var(--border);
  background:var(--topbar-bg);flex-shrink:0;
  backdrop-filter:var(--backdrop-blur);-webkit-backdrop-filter:var(--backdrop-blur);
  transition:background .35s ease,border-color .35s ease;
}
.topbar-toggle{
  background:transparent;border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;cursor:pointer;font-size:18px;color:var(--muted);
  transition:all .15s;flex-shrink:0;line-height:1;
}
.topbar-toggle:hover{border-color:var(--accent);color:var(--accent);}
.topbar-title{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.topbar-btn{
  display:flex;align-items:center;gap:5px;
  background:transparent;border:1px solid var(--border);border-radius:20px;
  padding:6px 12px;font-size:14px;color:var(--muted);cursor:pointer;transition:all .2s;
}
.topbar-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── 테마 Pill 버튼 ── */
.theme-pills{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.theme-pill{
  display:flex;align-items:center;gap:5px;
  background:transparent;border:1px solid var(--border);border-radius:20px;
  padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted);
  cursor:pointer;transition:all .2s;white-space:nowrap;line-height:1;
}
.theme-pill:hover{border-color:var(--accent);color:var(--text);}
.theme-pill.active{
  background:var(--accent-gradient);border-color:transparent;
  color:#fff;font-weight:700;
}
.t-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.t-dot-a{background:linear-gradient(135deg,#6366f1,#8b5cf6);}
.t-dot-b{background:linear-gradient(135deg,#0ea5e9,#06b6d4);}
.t-dot-c{background:linear-gradient(135deg,#10b981,#059669);}
.theme-pill.active .t-dot{background:#fff;opacity:.8;}

/* 모바일: 텍스트 숨김 */
@media(max-width:600px){.theme-pill .t-name{display:none;}.theme-pill{padding:5px 8px;}}

/* B 테마 전용: 카드 그림자 */
[data-theme="B"] .sidebar{box-shadow:1px 0 3px rgba(0,0,0,.04);}
[data-theme="B"] .topbar{box-shadow:0 1px 3px rgba(0,0,0,.04);}

/* iframe 영역 */
.iframe-wrap{flex:1;position:relative;overflow:hidden;}
.iframe-wrap iframe{width:100%;height:100%;border:none;}
.iframe-loading{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--loading-bg);z-index:10;
  transition:opacity .3s;
}
.iframe-loading.hidden{opacity:0;pointer-events:none;}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.iframe-loading p{margin-top:12px;color:var(--muted);font-size:15px;}

/* ── 모바일 오버레이 ── */
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:190;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.sb-overlay.visible{display:block;}

/* ── 모바일 하단 탭바 ── */
.mobile-tabbar{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:var(--card);border-top:1px solid var(--border);
  z-index:150;padding:4px 0;
  padding-bottom:max(4px, env(safe-area-inset-bottom));
  transition:background .35s ease,border-color .35s ease;
}
.mtab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  background:none;border:none;color:var(--muted);
  font-size:10px;font-weight:600;letter-spacing:.2px;
  cursor:pointer;padding:4px 2px;transition:color .15s;
  -webkit-tap-highlight-color:transparent;
}
.mtab-icon{font-size:20px;line-height:1.1;}
.mtab.active{color:var(--accent);}

/* ══════════════════════════════════════════
   반응형
   ══════════════════════════════════════════ */
/* 모바일 (< 900px) */
@media(max-width:900px){
  .sidebar{
    position:fixed;top:0;left:0;width:260px;height:100vh;
    transform:translateX(-260px);box-shadow:none;
  }
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.3);}
  .sidebar.collapsed{transform:translateX(-260px);}
  .main{margin-left:0 !important;}
  .mobile-tabbar{display:flex;}
  .iframe-wrap{padding-bottom:max(56px, calc(48px + env(safe-area-inset-bottom)));}
  .theme-pill .t-name{display:none;}
}

/* 데스크톱 (≥ 900px) */
@media(min-width:900px){
  .sb-overlay{display:none !important;}
  .sidebar{position:relative;}
  .sidebar.collapsed{position:absolute;}
  .mobile-tabbar{display:none !important;}
}

/* iOS safe area */
body{
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
</style>
</head>
<body>

<!-- 사이드바 오버레이 (모바일) -->
<div class="sb-overlay" id="sbOverlay" onclick="closeSidebar()"></div>

<div class="app">

<!-- ══════════════════════════════════════════
     사이드바
     ══════════════════════════════════════════ -->
<nav class="sidebar" id="sidebar">
  <div class="sb-header">
    <div class="sb-logo">
      <span class="sb-logo-icon">★</span>
      <span class="sb-logo-text">통합 자산관리</span>
    </div>
    <button class="sb-close" onclick="closeSidebar()" title="메뉴 닫기">✕</button>
  </div>

  <div class="sb-scroll">

    <!-- ══════════════════════════════════════
         📈 포트폴리오 (1단계 그룹)
         ══════════════════════════════════════ -->
    <div class="sb-group">
      <div class="sb-group-title expanded" onclick="toggleGroup(this)">
        <span>📈 포트폴리오</span>
        <span class="sb-arrow">▾</span>
      </div>
      <div class="sb-group-items open">

        <!-- 📈 포트폴리오 (2단계) -->
        <div class="sb-sub">
          <button class="sb-sub-title expanded" onclick="toggleSub(this)">
            <span class="sb-icon">📈</span><span class="sb-label">포트폴리오</span>
            <span class="sb-arrow">▾</span>
          </button>
          <div class="sb-sub-items open">
            <button class="sb-leaf active" data-src="portfolio" data-nav="portfolio.main" onclick="navTo(this)">
              <span class="sb-leaf-dot"></span>📊 대시보드
            </button>
            <button class="sb-leaf" data-src="portfolio" data-nav="portfolio.watchlist" onclick="navTo(this)">
              <span class="sb-leaf-dot"></span>👀 Watchlist
            </button>
            <button class="sb-leaf" data-src="portfolio" data-nav="portfolio.holdings" onclick="navTo(this)">
              <span class="sb-leaf-dot"></span>📋 보유 종목
            </button>
          </div>
        </div>

        <!-- 📅 거래 기록 (2단계) -->
        <div class="sb-sub">
          <button class="sb-sub-title" onclick="toggleSub(this)">
            <span class="sb-icon">📅</span><span class="sb-label">거래 기록</span>
            <span class="sb-arrow">▾</span>
          </button>
          <div class="sb-sub-items">
            <button class="sb-leaf" data-src="portfolio" data-nav="trading.transactions" onclick="navTo(this)">
              <span class="sb-leaf-dot"></span>📋 거래 내역
            </button>
            <button class="sb-leaf" data-src="portfolio" data-nav="trading.cashflow" onclick="navTo(this)">
              <span class="sb-leaf-dot"></span>💰 Cashflow
            </button>
          </div>
        </div>

        <!-- 📰 뉴스 (2단계 리프) -->
        <button class="sb-item" data-src="portfolio" data-nav="news" onclick="navTo(this)">
          <span class="sb-icon">📰</span><span class="sb-label">뉴스</span>
        </button>

      </div>
    </div>

    <!-- ══════════════════════════════════════
         💰 자산관리 (1단계 그룹)
         ══════════════════════════════════════ -->
    <div class="sb-group">
      <div class="sb-group-title expanded" onclick="toggleGroup(this)">
        <span>💰 자산관리</span>
        <span class="sb-arrow">▾</span>
      </div>
      <div class="sb-group-items open">

        <!-- 📊 대시보드 (2단계) -->
        <div class="sb-sub">
          <button class="sb-sub-title expanded" onclick="toggleSub(this)">
            <span class="sb-icon">📊</span><span class="sb-label">대시보드</span>
            <span class="sb-arrow">▾</span>
          </button>
          <div class="sb-sub-items open">
            <button class="sb-leaf" data-src="asset" data-nav="dashboard.asset-mgmt" onclick="navTo(this)">
              <span class="sb-leaf-dot"></span>💰 자산관리
            </button>
            <!-- 수입/지출관리 (Tier 3 — sb-sub-title와 동일 정렬이되 Tier3 위치) -->
            <div class="sb-sub">
              <button class="sb-sub-title expanded" style="padding-left:44px;" onclick="toggleSub(this)">
                <span>수입/지출관리</span>
                <span class="sb-arrow">▾</span>
              </button>
              <div class="sb-sub-items open">
                <button class="sb-leaf t4" data-src="asset" data-nav="dashboard.budget-insight.overview" onclick="navTo(this)">
                  <span class="sb-leaf-dot"></span>월간 분석
                </button>
                <button class="sb-leaf t4" data-src="asset" data-nav="dashboard.budget-insight.yoy" onclick="navTo(this)">
                  <span class="sb-leaf-dot"></span>연간 분석
                </button>
                <button class="sb-leaf t4" data-src="asset" data-nav="dashboard.budget-insight.table" onclick="navTo(this)">
                  <span class="sb-leaf-dot"></span>상세 내역
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 🏦 총자산 (2단계 리프) -->
        <button class="sb-item" data-src="asset" data-nav="asset" onclick="navTo(this)">
          <span class="sb-icon">🏦</span><span class="sb-label">총자산</span>
        </button>

        <!-- 📒 가계부 (2단계) -->
        <div class="sb-sub">
          <button class="sb-sub-title" onclick="toggleSub(this)">
            <span class="sb-icon">📒</span><span class="sb-label">가계부</span>
            <span class="sb-arrow">▾</span>
          </button>
          <div class="sb-sub-items">
            <button class="sb-leaf" data-src="asset" data-nav="budget..합계" onclick="navTo(this)">
              <span class="sb-leaf-dot"></span>합계
            </button>
            <button class="sb-leaf" data-src="asset" data-nav="budget..상은" onclick="navTo(this)">
              <span class="sb-leaf-dot"></span>상은
            </button>
            <button class="sb-leaf" data-src="asset" data-nav="budget..아영" onclick="navTo(this)">
              <span class="sb-leaf-dot"></span>아영
            </button>
          </div>
        </div>

      </div>
    </div>

  </div><!-- /sb-scroll -->

  <div class="sb-footer">
    <div class="sb-footer-text">상은 · 아영 통합 자산관리</div>
    <div class="sb-footer-ver">v4 · 2026.03.23</div>
  </div>
</nav>

<!-- ══════════════════════════════════════════
     메인 콘텐츠
     ══════════════════════════════════════════ -->
<div class="main" id="main">
  <!-- 상단 바 -->
  <div class="topbar">
    <button class="topbar-toggle" id="sbToggle" onclick="toggleSidebar()">☰</button>
    <div class="topbar-title" id="topbarTitle">📈 포트폴리오 대시보드</div>
    <div class="topbar-actions">
      <button class="topbar-btn" onclick="refreshIframe()">🔄 새로고침</button>
      <!-- 테마 Pill 선택 -->
      <div class="theme-pills" id="themePills">
        <button class="theme-pill active" data-theme="A" onclick="switchTheme('A',this)">
          <span class="t-dot t-dot-a"></span><span class="t-name">Violet</span>
        </button>
        <button class="theme-pill" data-theme="B" onclick="switchTheme('B',this)">
          <span class="t-dot t-dot-b"></span><span class="t-name">Blue</span>
        </button>
        <button class="theme-pill" data-theme="C" onclick="switchTheme('C',this)">
          <span class="t-dot t-dot-c"></span><span class="t-name">Emerald</span>
        </button>
      </div>
    </div>
  </div>

  <!-- iframe 콘텐츠 -->
  <div class="iframe-wrap">
    <div class="iframe-loading" id="iframeLoading">
      <div class="spinner"></div>
      <p>대시보드 로드 중…</p>
    </div>
    <iframe id="contentFrame" src="about:blank" allow="scripts" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"></iframe>
  </div>
</div>

</div><!-- /app -->

<!-- 모바일 하단 탭바 -->
<div class="mobile-tabbar" id="mobileTabbar">
  <button class="mtab active" data-src="portfolio" data-nav="portfolio.main" onclick="navTo(this)">
    <span class="mtab-icon">📈</span>포트폴리오
  </button>
  <button class="mtab" data-src="portfolio" data-nav="trading.transactions" onclick="navTo(this)">
    <span class="mtab-icon">📅</span>거래
  </button>
  <button class="mtab" data-src="portfolio" data-nav="news" onclick="navTo(this)">
    <span class="mtab-icon">📰</span>뉴스
  </button>
  <button class="mtab" data-src="asset" data-nav="dashboard.asset-mgmt" onclick="navTo(this)">
    <span class="mtab-icon">💰</span>자산
  </button>
  <button class="mtab" data-src="asset" data-nav="dashboard.budget-insight.overview" onclick="navTo(this)">
    <span class="mtab-icon">📊</span>수입/지출
  </button>
</div>

<script>
// ════════════════════════════════════════════
// 서버 주입 URL
// ════════════════════════════════════════════
const ASSET_URL     = '<?!= assetUrl ?>';
const PORTFOLIO_URL = '<?!= portfolioUrl ?>';

// ════════════════════════════════════════════
// 상태
// ════════════════════════════════════════════
let _sidebarOpen = window.innerWidth >= 900;
let _currentSrc  = '';  // 'asset' | 'portfolio'
let _currentNav  = '';
let _frameCache  = {};  // src별 마지막 nav 저장

// 메뉴 제목 매핑
const TITLES = {
  'dashboard.asset-mgmt':               '📊 자산관리 대시보드',
  'dashboard.budget-insight.overview':   '📊 수입/지출 · 월간 분석',
  'dashboard.budget-insight.yoy':       '📈 수입/지출 · 연간 분석',
  'dashboard.budget-insight.table':     '📋 수입/지출 · 상세 내역',
  'asset':                              '🏦 총자산',
  'budget..합계':                        '📒 가계부 · 합계',
  'budget..상은':                        '👤 가계부 · 상은',
  'budget..아영':                        '👤 가계부 · 아영',
  'portfolio.main':                     '📈 포트폴리오 대시보드',
  'portfolio.watchlist':                '👀 Watchlist',
  'portfolio.holdings':                 '📋 보유 종목',
  'trading.transactions':               '📋 거래 내역',
  'trading.cashflow':                   '💰 Cashflow',
  'news':                               '📰 투자 뉴스',
};

// 테마 정보
const THEMES = {
  A: { meta:'#0c0c14' },
  B: { meta:'#f0f4f8' },
  C: { meta:'#080d12' },
};

// ════════════════════════════════════════════
// 테마
// ════════════════════════════════════════════
function initTheme(){
  var saved = localStorage.getItem('unifiedDashTheme') || 'A';
  if (!THEMES[saved]) saved = 'A';
  applyTheme(saved);
}

function switchTheme(theme, pillEl){
  applyTheme(theme);
  localStorage.setItem('unifiedDashTheme', theme);
}

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  var info = THEMES[theme];
  // meta theme-color
  var meta = document.getElementById('meta-theme-color');
  if (meta) meta.content = info.meta;
  // Pill 버튼 active 표시
  document.querySelectorAll('.theme-pill').forEach(function(pill){
    pill.classList.toggle('active', pill.getAttribute('data-theme') === theme);
  });
}

// ════════════════════════════════════════════
// 사이드바 토글
// ════════════════════════════════════════════
function toggleSidebar(){
  _sidebarOpen ? closeSidebar() : openSidebar();
}
function openSidebar(){
  _sidebarOpen = true;
  var sb = document.getElementById('sidebar');
  sb.classList.remove('collapsed');
  if (window.innerWidth < 900) {
    sb.classList.add('open');
    document.getElementById('sbOverlay').classList.add('visible');
  }
}
function closeSidebar(){
  _sidebarOpen = false;
  var sb = document.getElementById('sidebar');
  sb.classList.add('collapsed');
  sb.classList.remove('open');
  document.getElementById('sbOverlay').classList.remove('visible');
}

// 1단계 그룹 토글
function toggleGroup(titleEl){
  titleEl.classList.toggle('expanded');
  var items = titleEl.nextElementSibling;
  if (items) items.classList.toggle('open');
}

// 2단계/3단계 서브 토글
function toggleSub(titleEl){
  titleEl.classList.toggle('expanded');
  var items = titleEl.nextElementSibling;
  if (items) items.classList.toggle('open');
}

// ════════════════════════════════════════════
// 네비게이션
// ════════════════════════════════════════════
function navTo(el){
  var src = el.getAttribute('data-src');
  var nav = el.getAttribute('data-nav');

  // 활성 표시 (사이드바 — sb-item + sb-leaf 모두 초기화)
  document.querySelectorAll('.sb-item, .sb-leaf').forEach(function(b){ b.classList.remove('active'); });
  // sb-item 또는 sb-leaf 중 매칭되는 것 활성화
  var sidebarItem = document.querySelector('.sb-item[data-nav="'+nav+'"], .sb-leaf[data-nav="'+nav+'"]');
  if (sidebarItem) sidebarItem.classList.add('active');

  // 활성 표시 (모바일 탭바)
  document.querySelectorAll('.mtab').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
  // 모바일 탭바 동기화 (같은 data-nav이 있으면)
  var mtab = document.querySelector('.mtab[data-nav="'+nav+'"]');
  if (mtab) mtab.classList.add('active');

  // 타이틀 업데이트
  document.getElementById('topbarTitle').textContent = TITLES[nav] || nav;

  // 모바일에서 사이드바 닫기
  if (window.innerWidth < 900) closeSidebar();

  // iframe 로드
  loadFrame(src, nav);
}

function loadFrame(src, nav){
  var baseUrl = src === 'asset' ? ASSET_URL : PORTFOLIO_URL;
  if (!baseUrl || baseUrl.indexOf('YOUR_') === 0) {
    showConfigWarning(src);
    return;
  }

  // URL 구성: ?embed=1&nav=xxx
  var sep = baseUrl.indexOf('?') >= 0 ? '&' : '?';
  var url = baseUrl + sep + 'embed=1&nav=' + encodeURIComponent(nav);

  // 같은 URL이면 리로드하지 않음
  var frame = document.getElementById('contentFrame');
  if (_currentSrc === src && _currentNav === nav) return;

  _currentSrc = src;
  _currentNav = nav;

  // 로딩 표시
  var loading = document.getElementById('iframeLoading');
  loading.classList.remove('hidden');

  frame.onload = function(){
    loading.classList.add('hidden');
  };
  frame.src = url;
}

function refreshIframe(){
  var frame = document.getElementById('contentFrame');
  if (frame.src && frame.src !== 'about:blank') {
    var loading = document.getElementById('iframeLoading');
    loading.classList.remove('hidden');
    frame.onload = function(){ loading.classList.add('hidden'); };
    frame.src = frame.src;
  }
}

function showConfigWarning(src){
  var frame = document.getElementById('contentFrame');
  var name = src === 'asset' ? '자산관리' : '포트폴리오';
  frame.srcdoc = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#6b7280;text-align:center;padding:20px;">' +
    '<div><h2 style="color:#f59e0b;margin-bottom:12px;">⚠️ URL 설정 필요</h2>' +
    '<p>' + name + ' 대시보드의 웹앱 배포 URL이 설정되지 않았습니다.</p>' +
    '<p style="margin-top:8px;font-size:14px;">통합대시보드 AppScript의 <code>' +
    (src === 'asset' ? 'ASSET_DASHBOARD_URL' : 'PORTFOLIO_DASHBOARD_URL') +
    '</code>을 설정해주세요.</p></div></div>';
  document.getElementById('iframeLoading').classList.add('hidden');
}

// ════════════════════════════════════════════
// 초기화
// ════════════════════════════════════════════
(function init(){
  initTheme();

  // 사이드바 초기 상태
  var sb = document.getElementById('sidebar');
  if (window.innerWidth >= 900) {
    sb.classList.remove('collapsed');
    _sidebarOpen = true;
  } else {
    sb.classList.add('collapsed');
    _sidebarOpen = false;
  }

  // 초기 페이지: 자산관리 대시보드 (sb-item 또는 sb-leaf 중 active인 것)
  var firstItem = document.querySelector('.sb-item.active, .sb-leaf.active');
  if (firstItem) {
    var src = firstItem.getAttribute('data-src');
    var nav = firstItem.getAttribute('data-nav');
    document.getElementById('topbarTitle').textContent = TITLES[nav] || nav;
    loadFrame(src, nav);
  }
})();

// 리사이즈 처리
window.addEventListener('resize', function(){
  if (window.innerWidth >= 900) {
    document.getElementById('sbOverlay').classList.remove('visible');
    document.getElementById('sidebar').classList.remove('open');
  }
});

// ════════════════════════════════════════════
// 터치 스와이프 (모바일 사이드바)
// ════════════════════════════════════════════
(function(){
  var startX=0, startY=0, dragging=false;
  var EDGE=30, MIN_DX=10;

  document.addEventListener('touchstart', function(e){
    var t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    dragging = (!_sidebarOpen && startX < EDGE) || _sidebarOpen;
  }, {passive:true});

  document.addEventListener('touchmove', function(e){
    if (!dragging) return;
  }, {passive:true});

  document.addEventListener('touchend', function(e){
    if (!dragging) return;
    dragging = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;
    if (Math.abs(dx) < MIN_DX || Math.abs(dy) > Math.abs(dx)) return;
    if (dx > 60 && !_sidebarOpen) openSidebar();
    if (dx < -60 && _sidebarOpen) closeSidebar();
  }, {passive:true});
})();
</script>

</body>
</html>
